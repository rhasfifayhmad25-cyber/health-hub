<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Health Hub V100 MAX</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f3f6fa;color:#172033}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:10px 14px;font-weight:700;background:#172033;color:#fff}.musicbar{position:sticky;top:0;z-index:50;background:#fff;border:1px solid #e1e6ee;border-radius:14px;padding:10px 12px;margin:12px auto;max-width:1100px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.musicbar select{width:auto;margin:0}.musicbar button{padding:8px 11px}
.wrap{max-width:1100px;margin:auto;padding:20px}.hide{display:none!important}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{background:#fff;border:1px solid #e1e6ee;border-radius:18px;padding:18px}.muted{color:#64748b}.danger{background:#dc2626}.alt{background:#e5e7eb;color:#172033}
header{background:#172033;color:#fff;padding:14px 18px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand{font-weight:900;font-size:20px}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav button{background:#334155;font-size:13px}
input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;margin:5px 0 12px}
.big{font-size:38px;font-weight:900}.bar{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#172033}
.gamebox{min-height:270px;margin-top:14px;border:1px dashed #b9c3d0;border-radius:16px;padding:16px;background:#fafcff}
.arena{height:230px;position:relative;background:#eef2f7;border-radius:15px;overflow:hidden}.target{position:absolute;width:52px;height:52px;border-radius:50%;background:#ef4444}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.cards button{height:60px}
#fab{position:fixed;right:18px;bottom:18px;z-index:9999;border-radius:999px}
table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left}
@media(max-width:600px){.wrap{padding:12px}.big{font-size:30px}}
.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#eef6ff;color:#24527a;font-weight:700;font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap}</style>
</head>
<body>
<div id="gate" class="wrap">
  <div class="card" style="max-width:500px;margin:60px auto">
    <h1>💚 Health Hub</h1><p class="muted">V100 MAX — ระบบจัดการเวลา สุขภาพ การเรียน และเกม</p>
    <h3>เข้าสู่ระบบ</h3>
    <input id="user" placeholder="ชื่อผู้ใช้">
    <input id="pass" type="password" placeholder="รหัสผ่าน">
    <button onclick="login()">เข้าสู่ระบบ</button>
    <p id="msg" class="muted"></p>
    <hr>
    <p>ยังไม่มีบัญชี?</p>
    <input id="newuser" placeholder="ชื่อผู้ใช้ใหม่">
    <input id="newpass" type="password" placeholder="รหัสผ่าน">
    <button onclick="register()" class="alt">สมัครบัญชี</button>
    <p class="muted" style="font-size:12px">Admin ทดลอง: admin / HHadmin2026!</p>
  </div>
</div>
<div id="app" class="hide"></div>
<div id="musicbar" class="musicbar hide"><b>🎵 เพลง Health Hub</b><select id="musicTrack"><option value="calm">🌙 Night Calm</option><option value="focus">📚 Focus Pulse</option><option value="game">🎮 Game Energy</option></select><button onclick="hhToggleMusic()" id="musicBtn">▶️ เปิดเพลง</button><button onclick="hhStopMusic()" class="alt">⏹ หยุด</button><span id="musicStatus" class="muted">เพลงปิด</span></div>
<button id="fab" class="hide" onclick="dashboard()">🚀 V100</button>

<script>
const ACCOUNT_KEY="hh_accounts_v100";
const DATA_KEY="hh_v100_data";
const defaultData={xp:0,level:1,coins:0,streak:0,lastDay:"",games:0,best:{},water:0,waterGoal:8,study:0,steps:0,sleep:0,mood:"",diary:"",checkin:false,achievements:[]};
let currentUser="";

function accounts(){try{return JSON.parse(localStorage.getItem(ACCOUNT_KEY)||"{}")}catch{return{}}}
function data(){try{return Object.assign({},defaultData,JSON.parse(localStorage.getItem(DATA_KEY+"_"+currentUser)||"{}"))}catch{return Object.assign({},defaultData)}}
function save(d){localStorage.setItem(DATA_KEY+"_"+currentUser,JSON.stringify(d))}
function today(){return new Date().toISOString().slice(0,10)}
function touch(d){let t=today();if(d.lastDay!==t){let y=new Date(Date.now()-86400000).toISOString().slice(0,10);d.streak=d.lastDay===y?d.streak+1:1;d.lastDay=t;d.water=0;d.study=0;d.steps=0;d.sleep=0;d.mood="";d.diary="";d.checkin=false}}
function reward(x,c){let d=data();touch(d);d.xp+=x;d.coins+=c;d.level=Math.floor(d.xp/500)+1;save(d)}
function achievement(id,name,ok){let d=data();if(ok&&!d.achievements.includes(id)){d.achievements.push(id);d.xp+=100;d.coins+=25;save(d);alert("🏆 "+name+" +100 XP")}}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

function register(){
 const u=newuser.value.trim(),p=newpass.value;
 if(u.length<3||p.length<4){msg.textContent="ชื่อผู้ใช้ 3 ตัวอักษร และรหัสผ่าน 4 ตัวอักษรขึ้นไป";return}
 const a=accounts();if(a[u]){msg.textContent="มีบัญชีนี้แล้ว";return}
 a[u]={password:p};localStorage.setItem(ACCOUNT_KEY,JSON.stringify(a));enter(u)
}
function login(){
 const u=user.value.trim(),p=pass.value,a=accounts();
 if(u==="admin"&&p==="HHadmin2026!"){enter(u);return}
 if(!a[u]||a[u].password!==p){msg.textContent="ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง";return}
 enter(u)
}
let hhAudio=null,hhGain=null,hhTimer=null,hhPlaying=false,hhStep=0;
const HH_MUSIC={calm:[261.63,329.63,392.00,329.63,293.66,349.23,440.00,349.23],focus:[220,261.63,329.63,392,329.63,261.63,246.94,293.66],game:[329.63,392,523.25,659.25,523.25,392,587.33,783.99]};
function hhStartMusic(){
  try{
    if(!hhAudio) hhAudio=new (window.AudioContext||window.webkitAudioContext)();
    if(hhAudio.state==='suspended') hhAudio.resume();
    if(hhTimer) clearInterval(hhTimer);
    hhGain=hhAudio.createGain(); hhGain.gain.value=.055; hhGain.connect(hhAudio.destination);
    hhPlaying=true; hhStep=0; document.getElementById('musicBtn').textContent='⏸️ พักเพลง'; document.getElementById('musicStatus').textContent='กำลังเล่นเพลง';
    const play=()=>{if(!hhPlaying)return; const track=document.getElementById('musicTrack')?.value||'calm'; const notes=HH_MUSIC[track]; const f=notes[hhStep++%notes.length]; const o=hhAudio.createOscillator(); const g=hhAudio.createGain(); o.type=track==='game'?'square':'sine'; o.frequency.value=f; g.gain.setValueAtTime(.0001,hhAudio.currentTime); g.gain.exponentialRampToValueAtTime(.18,hhAudio.currentTime+.03); g.gain.exponentialRampToValueAtTime(.0001,hhAudio.currentTime+.42); o.connect(g); g.connect(hhGain); o.start(); o.stop(hhAudio.currentTime+.45);}; play(); hhTimer=setInterval(play,500);
  }catch(e){alert('เบราว์เซอร์นี้ไม่รองรับเสียงเพลง')} }
function hhToggleMusic(){if(hhPlaying){hhPlaying=false;if(hhTimer)clearInterval(hhTimer);document.getElementById('musicBtn').textContent='▶️ เปิดเพลง';document.getElementById('musicStatus').textContent='เพลงหยุดชั่วคราว';}else hhStartMusic()}
function hhStopMusic(){hhPlaying=false;if(hhTimer)clearInterval(hhTimer);if(hhGain)hhGain.gain.setTargetAtTime(.0001,hhAudio?.currentTime||0,.03);document.getElementById('musicBtn').textContent='▶️ เปิดเพลง';document.getElementById('musicStatus').textContent='เพลงปิด'}

function enter(u){currentUser=u;gate.classList.add("hide");app.classList.remove("hide");fab.classList.remove("hide");document.getElementById("musicbar").classList.remove("hide");home()}
function logout(){currentUser="";app.classList.add("hide");fab.classList.add("hide");gate.classList.remove("hide")}

function layout(body){
 app.innerHTML=`<header><div class="brand">💚 Health Hub V100</div><div class="nav">
 <button onclick="home()">🏠 Home</button><button onclick="aiTutor()">🤖 AI เรียน</button><button onclick="games()">🎮 เกม</button><button onclick="health()">❤️ สุขภาพ</button><button onclick="schedule()">🗓️ ตาราง</button><button onclick="rpg()">🧙 RPG</button><button onclick="projectInfo()">📘 โครงงาน</button><button onclick="admin()">🛡️ Admin</button><button onclick="logout()">🚪 ออก</button>
 </div></header><main class="wrap">${body}</main>`
}

function home(){
 let d=data();touch(d);save(d);
 layout(`<div class="grid">
 <div class="card"><small>LEVEL</small><div class="big">Lv.${d.level}</div><b>${d.xp} XP</b><div class="bar"><i style="width:${(d.xp%500)/5}%"></i></div></div>
 <div class="card"><small>🔥 STREAK</small><div class="big">${d.streak}</div><span>วัน</span></div>
 <div class="card"><small>🪙 COINS</small><div class="big">${d.coins}</div></div>
 <div class="card"><small>🎮 GAMES</small><div class="big">${d.games}</div></div></div>
 <div class="grid" style="margin-top:14px">
 <div class="card"><h3>⚡ Focus Sprint</h3><div id="focusClock" class="big">25:00</div><button onclick="focusTimer(25)">25 นาที</button> <button onclick="focusTimer(50)" class="alt">50 นาที</button></div>
 <div class="card"><h3>💧 Water</h3><p>${d.water}/${d.waterGoal} แก้ว</p><button onclick="water()">+ ดื่มน้ำ</button></div>
 <div class="card"><h3>📋 Check-in</h3><p>${d.checkin?"✅ เช็กอินแล้ว":"ยังไม่ได้เช็กอิน"}</p><button onclick="checkin()">เช็กอิน +50 XP</button></div>
 </div>
 <div class="card" style="margin-top:14px"><h2>🚀 V100 MAX</h2><p class="muted">Game Center + สุขภาพ + XP + Achievement + Admin</p><button onclick="games()">🎮 เล่นเกม</button> <button onclick="health()" class="alt">📝 บันทึกสุขภาพ</button></div>`)
}
function dashboard(){home()}

function projectInfo(){
 layout(`<div class="card"><h2>📘 Health Hub — โครงงาน</h2><p class="muted">ระบบหลังบ้านสำหรับติดตามเวลาเล่นเกมและแจ้งเตือนเวลานอน เพื่อช่วยนักเรียนจัดสรรเวลาเล่นเกม การเรียน และการนอน</p></div>
 <div class="grid" style="margin-top:14px">
  <div class="card"><h3>🎯 วัตถุประสงค์</h3><ol><li>พัฒนาระบบหลังบ้านสำหรับบันทึกและติดตามเวลาเล่นเกม</li><li>สร้างระบบแจ้งเตือนและแดชบอร์ดสรุปสถิติเวลาเล่นเกมและการนอน</li><li>ส่งเสริมให้นักเรียนจัดสรรเวลาเล่นเกม การเรียน และการนอนได้อย่างมีประสิทธิภาพ</li></ol></div>
  <div class="card"><h3>👨‍🎓 กลุ่มเป้าหมาย</h3><p>นักเรียนระดับชั้นมัธยมศึกษา</p><h3>⏱️ ระยะเวลา</h3><p>4 สัปดาห์ หรือปรับตามระยะเวลาจริงของรายวิชา</p></div>
 </div>
 <div class="grid" style="margin-top:14px">
  <div class="card"><h3>🗄️ ระบบหลังบ้าน</h3><p>ใช้ <b>Google Sheets / Firebase</b> สำหรับบันทึกข้อมูลเวลาเล่นเกม เวลานอน และข้อมูลกิจกรรมของผู้ใช้</p></div>
  <div class="card"><h3>📊 การแสดงผล</h3><p>สร้าง Dashboard สำหรับสรุปเวลาเล่นเกม เวลานอน และแนวโน้มการจัดสรรเวลา โดยสามารถนำข้อมูลไปแสดงผ่าน <b>Looker Studio</b></p></div>
  <div class="card"><h3>🔔 ระบบแจ้งเตือน</h3><p>ตั้งเวลาเตือนหยุดเล่นเกมและเตรียมตัวนอน โดยเชื่อมแนวทางการแจ้งเตือนกับ <b>Google Tasks</b> หรือระบบแจ้งเตือนในเว็บ</p></div>
 </div>
 <div class="card" style="margin-top:14px"><h3>📅 แผนการดำเนินงาน 4 สัปดาห์</h3><table><tr><th>สัปดาห์</th><th>งาน</th></tr><tr><td>1</td><td>วิเคราะห์ปัญหา ออกแบบฐานข้อมูล และออกแบบหน้าเว็บ</td></tr><tr><td>2</td><td>พัฒนาระบบบันทึกเวลาเล่นเกมและข้อมูลการนอน</td></tr><tr><td>3</td><td>พัฒนา Dashboard ระบบแจ้งเตือน และทดสอบการใช้งาน</td></tr><tr><td>4</td><td>เก็บผลการทดลอง ปรับปรุงระบบ และจัดทำเอกสารโครงงาน</td></tr></table></div>
 <div class="grid" style="margin-top:14px">
  <div class="card"><h3>📚 เอกสารประกอบ</h3><ul><li>คู่มือ Google Sheets API</li><li>คู่มือ Looker Studio</li><li>Backend Documentation</li><li>บทความวิจัยเกี่ยวกับการจัดสรรเวลาและการนอนของวัยเรียน</li></ul></div>
  <div class="card"><h3>💡 ปัญหาที่ต้องการแก้</h3><p>ตื่นสาย ไปโรงเรียนไม่ทัน ลืมส่งการบ้าน นอนดึกเพราะเล่นโทรศัพท์เพลิน และลืมจัดกระเป๋านักเรียนในตอนเย็น</p><p><b>แนวทาง:</b> ตั้งปลุก 2 เวลา วางโทรศัพท์ห่างจากเตียง กำหนดเวลาเลิกใช้โทรศัพท์ไม่เกิน 22:00 น. และจัดกระเป๋าตั้งแต่ช่วงเย็น</p></div>
 </div>`)}

function water(){let d=data();touch(d);d.water=Math.min(d.waterGoal,d.water+1);d.xp+=10;d.coins+=2;achievement("water","Hydration Hero",d.water>=d.waterGoal);save(d);home()}
function checkin(){let d=data();touch(d);if(!d.checkin){d.checkin=true;d.xp+=50;d.coins+=10;achievement("checkin","Daily Check-in",true);save(d)}home()}
let focusInterval;
function focusTimer(min){clearInterval(focusInterval);let end=Date.now()+min*60000;focusInterval=setInterval(()=>{let left=Math.max(0,end-Date.now()),s=Math.ceil(left/1000),e=document.getElementById("focusClock");if(e)e.textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");if(!left){clearInterval(focusInterval);reward(150,30);alert("🎉 Focus สำเร็จ +150 XP");home()}},250)}

function health(){let d=data();layout(`<div class="card"><h2>❤️ Daily Health Log</h2>
<label>😴 ชั่วโมงนอน</label><input id="sleep" type="number" min="0" max="24" step=".5" value="${d.sleep}">
<label>👟 จำนวนก้าว</label><input id="steps" type="number" min="0" max="100000" value="${d.steps}">
<label>📚 เรียนวันนี้ (นาที)</label><input id="study" type="number" min="0" max="1440" value="${d.study}">
<label>🙂 อารมณ์</label><select id="mood"><option>ดีมาก</option><option>ดี</option><option>ปกติ</option><option>เหนื่อย</option><option>เครียด</option></select>
<label>📔 Diary</label><textarea id="diary" rows="5">${esc(d.diary)}</textarea><button onclick="saveHealth()">💾 บันทึก</button></div>`)}
function saveHealth(){let d=data();d.sleep=+sleep.value||0;d.steps=+steps.value||0;d.study=+study.value||0;d.mood=mood.value;d.diary=diary.value;d.xp+=40;d.coins+=8;achievement("sleep7","Sleep Logged",d.sleep>=7);achievement("study30","Study 30m",d.study>=30);save(d);home()}

function schedule(){layout(`<div class="card"><h2>🗓️ ตารางวันนี้</h2><input id="activity" placeholder="กิจกรรม เช่น อ่านหนังสือ"><input id="time" type="time"><button onclick="addSchedule()">เพิ่มกิจกรรม</button><div id="scheduleList"></div></div>`);renderSchedule()}
function addSchedule(){let a=JSON.parse(localStorage.getItem("hh_schedule_"+currentUser)||"[]");a.push({activity:activity.value,time:time.value});localStorage.setItem("hh_schedule_"+currentUser,JSON.stringify(a));renderSchedule()}
function renderSchedule(){let a=JSON.parse(localStorage.getItem("hh_schedule_"+currentUser)||"[]");scheduleList.innerHTML=a.map((x,i)=>`<p>⏰ ${esc(x.time)} — ${esc(x.activity)} <button class="danger" onclick="delSchedule(${i})">ลบ</button></p>`).join("")||"<p class='muted'>ยังไม่มีรายการ</p>"}
function delSchedule(i){let a=JSON.parse(localStorage.getItem("hh_schedule_"+currentUser)||"[]");a.splice(i,1);localStorage.setItem("hh_schedule_"+currentUser,JSON.stringify(a));renderSchedule()}

function games(){layout(`<div class="card"><h2>🎮 Game Center</h2><p>เกมสั้น โหลดเร็ว เล่นได้ทันที</p><div class="grid">
<div class="card"><h3>⚡ Tap Rush</h3><p>กดให้ได้มากที่สุดใน 10 วิ</p><button onclick="tapRush()">เล่น</button></div>
<div class="card"><h3>🎯 Target Hunt</h3><p>ยิงเป้าใน 20 วิ</p><button onclick="targetHunt()">เล่น</button></div>
<div class="card"><h3>🧠 Memory Match</h3><p>จับคู่ 4×4</p><button onclick="memory()">เล่น</button></div>
<div class="card"><h3>⚡ Reaction Test</h3><p>กดเมื่อเปลี่ยนเป็นเขียว</p><button onclick="reaction()">เล่น</button></div></div><div id="game" class="gamebox">เลือกเกมด้านบน</div></div>`)}

function finish(id,score,xp){let d=data();d.games++;d.best[id]=Math.max(d.best[id]||0,score);d.xp+=xp;d.coins+=Math.max(1,Math.floor(xp/10));d.level=Math.floor(d.xp/500)+1;achievement("games10","Game Starter",d.games>=10);save(d);game.innerHTML=`<h2>🎉 จบเกม</h2><div class="big">${score}</div><p>+${xp} XP · Best: ${d.best[id]}</p><button onclick="games()">เกมอื่น</button>`}
function tapRush(){game.innerHTML='<h2>⚡ TAP RUSH</h2><p id="t">10</p><button id="tap" style="width:100%;height:160px;font-size:32px">TAP!</button>';let n=0,t=10;tap.onclick=()=>n++;let i=setInterval(()=>{t--;document.getElementById("t").textContent=t;if(t<=0){clearInterval(i);finish("tap",n,Math.min(220,30+n*4))}},1000)}
function targetHunt(){game.innerHTML='<h2>🎯 TARGET HUNT</h2><p id="tc">20</p><div id="arena" class="arena"></div>';let n=0,t=20;function spawn(){let q=document.createElement("button");q.className="target";q.style.left=Math.random()*88+"%";q.style.top=Math.random()*75+"%";q.onclick=()=>{n++;q.remove();spawn()};arena.appendChild(q)}spawn();let i=setInterval(()=>{tc.textContent=--t;if(t<=0){clearInterval(i);finish("target",n,Math.min(240,40+n*5))}},1000)}
function reaction(){game.innerHTML='<button id="rx" style="width:100%;height:180px;font-size:28px">เริ่ม</button>';let state=0,start=0,to;rx.onclick=()=>{if(!state){state=1;rx.textContent="รอ...";to=setTimeout(()=>{state=2;start=performance.now();rx.textContent="กดเลย!";rx.style.background="#16a34a"},1000+Math.random()*2200)}else if(state===1){clearTimeout(to);state=0;rx.textContent="❌ เร็วไป"}else{let ms=Math.round(performance.now()-start);finish("reaction",Math.max(1,1000-ms),Math.max(30,160-Math.floor(ms/10)))}}}
function memory(){let vals=["🍎","🍌","🍇","🍉","🥝","🍓","🥑","🍒"].concat(["🍎","🍌","🍇","🍉","🥝","🍓","🥑","🍒"]).sort(()=>Math.random()-.5),open=[],lock=false,m=0;game.innerHTML='<h2>🧠 MEMORY MATCH</h2><div id="cards" class="cards"></div>';vals.forEach(v=>{let q=document.createElement("button");q.textContent="❓";q.onclick=()=>{if(lock||q.done||open.includes(q))return;q.textContent=v;open.push(q);if(open.length===2){lock=true;if(open[0].textContent===open[1].textContent){open.forEach(x=>x.done=true);open=[];lock=false;if(++m===8)finish("memory",8,180)}else setTimeout(()=>{open.forEach(x=>x.textContent="❓");open=[];lock=false},500)}};cards.appendChild(q)})}

function rpg(){let d=data();layout(`<div class="card"><h2>🧙 Health RPG</h2><p>❤️ HP 100 · 🔷 MP 50 · ⚔️ ATK 10 · 🛡️ DEF 10</p><div class="grid"><div class="card"><h3>😴 Sleep Demon</h3><p>HP 300</p><button onclick="bossHit(30)">⚔️ Focus Strike</button></div><div class="card"><h3>📚 Knowledge Titan</h3><p>HP 500</p><button onclick="bossHit(50)">⚔️ Study Attack</button></div></div><p id="bossLog"></p></div>`)}

async function askAITutor(){
 const q=(document.getElementById("aiQuestion")?.value||"").trim();
 const subject=document.getElementById("aiSubject")?.value||"ทั่วไป";
 const answer=document.getElementById("aiAnswer");
 const status=document.getElementById("aiStatus");
 if(!q){alert("พิมพ์คำถามก่อนนะครับ");return}
 status.textContent="🧠 กำลังค้นหาคำอธิบายจากบทเรียนในระบบ...";
 const s=q.toLowerCase();
 let out="";
 if(subject==="คณิตศาสตร์" || /สมการ|เศษส่วน|ร้อยละ|พื้นที่|พีทาโกรัส|พีชคณิต|คณิต/.test(s)){
   out="📘 แนวทางเรียนคณิตศาสตร์\\n\\n1. อ่านโจทย์และจดสิ่งที่โจทย์ให้มา\\n2. ระบุสิ่งที่โจทย์ต้องการหา\\n3. เลือกสูตรหรือวิธีที่เกี่ยวข้อง\\n4. แทนค่าและคำนวณทีละขั้น\\n5. ตรวจคำตอบอีกครั้ง\\n\\n💡 ถ้าส่งโจทย์เต็ม ๆ มา ผมจะช่วยแยกโจทย์และอธิบายวิธีทำทีละขั้นให้ครับ";
 }else if(subject==="วิทยาศาสตร์" || /แรง|พลังงาน|เซลล์|สังเคราะห์แสง|อะตอม|สาร|วิทย์|วิทยาศาสตร์/.test(s)){
   out="🔬 แนวทางเรียนวิทยาศาสตร์\\n\\nลองแบ่งเรื่องเป็น 3 ส่วน: “คืออะไร → เกิดขึ้นอย่างไร → มีตัวอย่างอะไร”\\n\\n💡 ถ้าบอกชื่อบทหรือส่งคำถามมา ผมจะช่วยสรุปเป็นภาษาง่าย ๆ พร้อมตัวอย่างให้ครับ";
 }else if(subject==="ภาษาอังกฤษ" || /english|grammar|อังกฤษ|present|past|tense|verb/.test(s)){
   out="🇬🇧 แนวทางเรียนภาษาอังกฤษ\\n\\nเริ่มจากดูว่าใครทำอะไร เมื่อไหร่ และประโยคเป็นบอกเล่า/ปฏิเสธ/คำถาม จากนั้นจึงเลือก tense ให้เหมาะสม\\n\\n💡 ส่งประโยคที่ไม่เข้าใจมาได้เลย ผมจะช่วยแปลและอธิบายไวยากรณ์ให้ครับ";
 }else{
   out="📚 ผู้ช่วยเรียน Health Hub\\n\\nผมช่วยได้ในเรื่อง:\\n• สรุปบทเรียนให้เข้าใจง่าย\\n• อธิบายคำศัพท์\\n• แยกโจทย์เป็นขั้นตอน\\n• ช่วยตรวจแนวคิดในการทำการบ้าน\\n• ทำตัวอย่างเพื่อฝึกเพิ่มเติม\\n\\nลองพิมพ์คำถามพร้อมชื่อวิชา เช่น “คณิตศาสตร์ ม.2 ช่วยอธิบายสมการเชิงเส้นให้หน่อย”";
 }
 answer.textContent=out;
 status.textContent="✅ พร้อมช่วยเรียนแล้ว";
 reward(5,1);
}

 const key=localStorage.getItem("hh_gemini_admin_key")||"";
 return `<section class="card" style="margin-top:14px">

function saveAdminGeminiKey(){
 const k=(document.getElementById("adminGeminiKey")?.value||"").trim();
 if(!k)return alert("กรุณาใส่ Gemini API Key");
 localStorage.setItem("hh_gemini_admin_key",k);
 localStorage.setItem("hh_gemini_key",k);
 const s=document.getElementById("adminKeyStatus"); if(s)s.textContent="✅ บันทึกคีย์ AI สำหรับเครื่องนี้แล้ว";
 alert("ตั้งค่า AI Key สำหรับผู้ใช้เครื่องนี้แล้ว ✅");

function removeAdminGeminiKey(){
 localStorage.removeItem("hh_gemini_admin_key");
 localStorage.removeItem("hh_gemini_key");
 const e=document.getElementById("adminGeminiKey"); if(e)e.value="";
 const s=document.getElementById("adminKeyStatus"); if(s)s.textContent="⚠️ ลบคีย์ AI แล้ว";
}
async function testAdminGeminiKey(){
 const k=(document.getElementById("adminGeminiKey")?.value||"").trim();
 const s=document.getElementById("adminKeyStatus");
 if(!k){if(s)s.textContent="⚠️ กรุณาใส่คีย์ก่อน";return}
 if(s)s.textContent="⏳ กำลังทดสอบ...";
 try{
   const res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent",{
     method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":k},
     body:JSON.stringify({contents:[{parts:[{text:"ตอบสั้น ๆ ว่า AI Health Hub พร้อมใช้งาน"}]}]})
   });
   const data=await res.json();
   if(!res.ok)throw new Error(data?.error?.message||"คีย์ไม่ผ่าน");
   if(s)s.textContent="✅ ทดสอบสำเร็จ: AI พร้อมใช้งาน";
 }catch(e){if(s)s.textContent="❌ ทดสอบไม่สำเร็จ: "+e.message}
}

function admin(){let d=data(),a=accounts();layout(`<div class="grid"><div class="card"><h2>🛡️ Admin Dashboard</h2><p>บัญชีทั้งหมดในเครื่อง: ${Object.keys(a).length}</p><p>ผู้ใช้ปัจจุบัน: ${esc(currentUser)}</p></div><div class="card"><h3>📊 สถิติผู้ใช้ปัจจุบัน</h3><p>Level ${d.level}</p><p>${d.xp} XP</p><p>${d.games} เกม</p><p>${d.coins} Coins</p></div></div><div class="card" style="margin-top:14px"><h3>👥 Accounts</h3><table><tr><th>Username</th><th>Action</th></tr>${Object.keys(a).map(u=>`<tr><td>${esc(u)}</td><td>${u!=="admin"?`<button class="danger" onclick="deleteAccount('${esc(u)}')">ลบ</button>`:"🔒 protected"}</td></tr>`).join("")}</table></div><div class="card" style="margin-top:14px"><h3>💾 Export</h3><button onclick="exportData()">ดาวน์โหลดข้อมูล JSON</button> <button class="danger" onclick="resetMyData()">รีเซ็ตข้อมูลผู้ใช้</button></div>`)}
function deleteAccount(u){if(currentUser!=="admin")return alert("เฉพาะ admin");if(confirm("ลบบัญชี "+u+"?")){let a=accounts();delete a[u];localStorage.setItem(ACCOUNT_KEY,JSON.stringify(a));admin()}}
function exportData(){let all={accounts:accounts(),current:data()};let a=document.createElement("a");a.href="data:application/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(all,null,2));a.download="health-hub-admin-export.json";a.click()}
function resetMyData(){if(confirm("รีเซ็ตข้อมูลผู้ใช้ปัจจุบัน?")){localStorage.removeItem(DATA_KEY+"_"+currentUser);home()}}
</script>
