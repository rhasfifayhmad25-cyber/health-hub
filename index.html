<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Health Hub V13</title><style>
:root{--bg:#06101d;--card:#0d1b2c;--line:#24425f;--txt:#eef7ff;--muted:#91a9c2;--a:#5eead4;--b:#60a5fa;--bad:#fb7185}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#123653,#050a12 65%);color:var(--txt);font-family:system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button{border:0;border-radius:12px;padding:10px 14px;background:#17324f;color:#fff;cursor:pointer}button:hover{filter:brightness(1.1)}.primary{background:linear-gradient(135deg,#14b8a6,#3b82f6)}.danger{background:#7f1d2d}.hidden{display:none!important}.wrap{max-width:1200px;margin:auto;padding:20px}.card{background:#0d1b2ee8;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 12px 30px #0005}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.input{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:#07111f;color:#fff;margin:5px 0 11px}.muted{color:var(--muted)}header{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:14px 18px;background:#07111fee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.brand{font-size:20px;font-weight:900}.nav{display:flex;gap:6px;flex-wrap:wrap}.big{font-size:34px;font-weight:900}.chat{max-height:55vh;overflow:auto}.msg{padding:11px;border-radius:14px;margin:8px 0;background:#10263d}.me{border-left:3px solid var(--a)}.ai{border-left:3px solid var(--b)}.room{font-size:34px;letter-spacing:6px;font-weight:900}.player{display:flex;justify-content:space-between;padding:9px;border-bottom:1px solid var(--line)}footer{text-align:center;padding:30px;color:var(--muted)}.ok{color:#86efac}.bad{color:#fda4af}.bossbar{height:16px;background:#29131a;border-radius:99px;overflow:hidden;border:1px solid #7f1d2d}.bossfill{height:100%;background:linear-gradient(90deg,#ef4444,#f59e0b);transition:width .25s}.hero{padding:22px;border:1px solid #805d1b;background:linear-gradient(135deg,#27170a,#17101b);border-radius:18px}.xp{font-size:18px;font-weight:800}
</style></head><body><div id="app"></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,updateProfile} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getDatabase,ref,set,push,onValue,update,remove} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js';
import {getFirestore,doc,setDoc,collection,query,where,onSnapshot,addDoc,deleteDoc} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
import {getMessaging,getToken,onMessage} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-messaging.js';
const savedCfg=JSON.parse(localStorage.getItem('hh_firebase_config')||'{}'); const cfg=Object.keys(savedCfg).length?savedCfg:(window.FIREBASE_CONFIG||{}); const configured=!!cfg.apiKey&&!String(cfg.apiKey).startsWith('YOUR_'); const BACKEND_URL=localStorage.getItem('hh_backend')||'https://YOUR_BACKEND_DOMAIN'; const VAPID_KEY=localStorage.getItem('hh_vapid')||'YOUR_FIREBASE_WEB_PUSH_VAPID_KEY';
let app,auth,rt,fs,messaging,user=null,roomsUnsub=null; let reminders=[]; let aiHist=[];
const A=document.getElementById('app');
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shell(body){return `<header><div class="brand">💚 Health Hub V13</div><div class="nav"><button onclick="home()">หน้าหลัก</button><button onclick="ai()">🤖 AI</button><button onclick="schedule()">🗓️ ตาราง</button><button onclick="multiplayer()">👥 แข่งกัน</button><button onclick="notify()">🔔 แจ้งเตือน</button><button onclick="sleep()">😴 นอน</button><button onclick="quiz()">🎯 ด่านคำถาม</button><button onclick="character()">🧙 ตัวละคร</button><button onclick="shop135()">🛒 ร้านค้า</button><button onclick="leaderboard()">🏆 Leaderboard</button><button onclick="setup()">⚙️ ตั้งค่า</button><button onclick="logout()">ออก</button></div></header><main class="wrap">${body}</main><footer>V13 • Firebase + AI + Multiplayer + Push Notification</footer>`}
function setup(){
A.innerHTML=`<main class="wrap" style="max-width:820px;margin:5vh auto"><div class="card"><h1>⚙️ Firebase / AI Setup Wizard</h1><p class="muted">กรอกค่าจาก Firebase Console แล้วกดบันทึก ระบบจะเก็บค่า config สำหรับเว็บนี้ไว้ในเครื่องนี้</p>
<div class="grid">
<div><label>Firebase API Key</label><input id="fc_apiKey" class="input" placeholder="AIza..."></div>
<div><label>Auth Domain</label><input id="fc_authDomain" class="input" placeholder="your-project.firebaseapp.com"></div>
<div><label>Realtime Database URL</label><input id="fc_databaseURL" class="input" placeholder="https://your-project-default-rtdb.asia-southeast1.firebasedatabase.app"></div>
<div><label>Project ID</label><input id="fc_projectId" class="input" placeholder="your-project-id"></div>
<div><label>Storage Bucket</label><input id="fc_storageBucket" class="input" placeholder="your-project.firebasestorage.app"></div>
<div><label>Messaging Sender ID</label><input id="fc_messagingSenderId" class="input" placeholder="1234567890"></div>
<div><label>Firebase App ID</label><input id="fc_appId" class="input" placeholder="1:1234567890:web:..."></div>
<div><label>VAPID Public Key</label><input id="vapid" class="input" placeholder="B..." ></div>
<div style="grid-column:1/-1"><label>Backend URL</label><input id="backend" class="input" placeholder="https://your-backend.example.com"></div>
</div>
<div class="row"><button class="primary" onclick="saveSetup()">💾 บันทึก Config</button><button onclick="clearSetup()">ล้างค่า</button></div><p id="setupmsg" class="muted"></p>
<div class="card"><h3>หาแต่ละค่าได้จากไหน?</h3><p>Firebase Console → Project settings → General → Your apps → Web app สำหรับ Firebase config</p><p>VAPID: Project settings → Cloud Messaging → Web Push certificates → Generate key pair</p><p>Backend URL คือ URL ของ server ที่รัน <code>/api/chat</code> และระบบส่ง Push</p></div>
<button onclick="login()">← กลับหน้าเข้าสู่ระบบ</button></div></main>`;
const c=JSON.parse(localStorage.getItem('hh_firebase_config')||'{}');
for(const k of ['apiKey','authDomain','databaseURL','projectId','storageBucket','messagingSenderId','appId']){const e=document.getElementById('fc_'+k);if(e)e.value=c[k]||''}
document.getElementById('vapid').value=localStorage.getItem('hh_vapid')||'';document.getElementById('backend').value=localStorage.getItem('hh_backend')||'';
}
window.saveSetup=()=>{const c={};for(const k of ['apiKey','authDomain','databaseURL','projectId','storageBucket','messagingSenderId','appId'])c[k]=document.getElementById('fc_'+k).value.trim();localStorage.setItem('hh_firebase_config',JSON.stringify(c));localStorage.setItem('hh_vapid',document.getElementById('vapid').value.trim());localStorage.setItem('hh_backend',document.getElementById('backend').value.trim());window.FIREBASE_CONFIG=c;alert('บันทึกแล้ว ✓ กำลังโหลดระบบใหม่');location.reload()};
window.clearSetup=()=>{localStorage.removeItem('hh_firebase_config');localStorage.removeItem('hh_vapid');localStorage.removeItem('hh_backend');setup()};
function login(){A.innerHTML=`<main class="wrap" style="max-width:450px;margin:8vh auto"><div class="card"><h1>👋 Health Hub V13</h1><p class="muted">AI จริง • แข่งข้ามเครื่อง • แจ้งเตือนแม้ปิดหน้าเว็บ</p>${!configured?'<div class="card" style="border-color:#fb7185"><b>ยังไม่ได้ตั้งค่า Firebase</b><p class="muted">กดปุ่มตั้งค่าเพื่อกรอก Config / VAPID / Backend URL</p><button onclick="setup()">⚙️ เปิด Setup Wizard</button></div>':''}<input id="email" class="input" placeholder="อีเมล"><input id="pw" class="input" type="password" placeholder="รหัสผ่าน"><input id="name" class="input" placeholder="ชื่อผู้ใช้ (ตอนสมัคร)"><div class="row"><button class="primary" onclick="loginDo()">เข้าสู่ระบบ</button><button onclick="registerDo()">สมัครบัญชี</button><button onclick="setup()">⚙️ ตั้งค่า</button></div><p id="err" class="bad"></p></div></main>`}
window.loginDo=async()=>{try{await signInWithEmailAndPassword(auth,email.value,pw.value)}catch(e){err.textContent=e.message}};
window.registerDo=async()=>{try{const c=await createUserWithEmailAndPassword(auth,email.value,pw.value);if(name.value)await updateProfile(c.user,{displayName:name.value});await setDoc(doc(fs,'users',c.user.uid),{uid:c.user.uid,email:c.user.email,displayName:name.value||c.user.email,createdAt:Date.now(),role:'USER'},{merge:true})}catch(e){err.textContent=e.message}};
window.logout=()=>signOut(auth);
function home(){A.innerHTML=shell(`<section class="card"><h1>สวัสดี ${esc(user.displayName||user.email)}</h1><p class="muted">ศูนย์รวม AI, ตารางเรียน, เกม, การนอน และการแข่งขัน</p><div class="grid"><div class="card"><h3>🤖 AI</h3><p>ถามได้ทั้งเรื่องเรียน งาน เขียนโค้ด วางแผน และคำถามทั่วไป</p><button class="primary" onclick="ai()">คุยกับ AI</button></div><div class="card"><h3>👥 Multiplayer</h3><p>สร้างห้อง แชร์รหัส เล่นพร้อมเพื่อน และดูคะแนนสด</p><button onclick="multiplayer()">ไป Arena</button></div><div class="card"><h3>🔔 Push</h3><p>แจ้งเตือนเวลาเรียน พัก เล่นเกม และเข้านอน</p><button onclick="notify()">ตั้งค่า</button></div></div></section>`)}
window.ai=()=>{A.innerHTML=shell(`<section class="card"><h2>🤖 Health Hub AI</h2><p class="muted">AI เชื่อม backend/OpenAI ไม่ควรใส่ API key ในหน้าเว็บ</p><div id="chat" class="chat"></div><div class="row"><input id="aq" class="input" style="flex:1" placeholder="ถามอะไรก็ได้..." onkeydown="if(event.key==='Enter')ask()"><button class="primary" onclick="ask()">ส่ง</button></div></section>`);renderChat()};
function renderChat(){document.getElementById('chat').innerHTML=aiHist.map(x=>`<div class="msg ${x.role==='user'?'me':'ai'}"><b>${x.role==='user'?'คุณ':'AI'}</b><br>${esc(x.text).replace(/\n/g,'<br>')}</div>`).join('');document.getElementById('chat').scrollTop=999999}
window.ask=async()=>{let q=document.getElementById('aq').value.trim();if(!q)return;aiHist.push({role:'user',text:q},{role:'assistant',text:'กำลังคิด...'});renderChat();document.getElementById('aq').value='';try{const r=await fetch((location.hostname==='localhost'?'http://localhost:8787':BACKEND_URL)+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q,history:aiHist.slice(0,-1),user:{uid:user.uid,name:user.displayName,email:user.email}})});const d=await r.json();if(!r.ok)throw Error(d.error||'AI error');aiHist[aiHist.length-1].text=d.answer||'ไม่มีคำตอบ';}catch(e){aiHist[aiHist.length-1].text='เชื่อม AI ไม่สำเร็จ: '+e.message}renderChat()};
window.schedule=()=>A.innerHTML=shell(`<section class="card"><h2>🗓️ ตารางของฉัน</h2><p class="muted">บันทึกตารางลง Firestore เพื่อใช้ร่วมกับระบบแจ้งเตือน</p><div class="grid"><div><label>ชื่อกิจกรรม</label><input id="sn" class="input" placeholder="เรียนคณิต"></div><div><label>เวลา</label><input id="st" class="input" type="time"></div><div><label>ประเภท</label><select id="sk" class="input"><option>เรียน</option><option>พัก</option><option>เล่นเกม</option><option>นอน</option></select></div></div><button class="primary" onclick="addSchedule()">+ เพิ่มกิจกรรม</button><div id="sched" style="margin-top:14px"></div></section>`);loadSchedule();
async function addSchedule(){if(!sn.value||!st.value)return alert('กรอกให้ครบ');await addDoc(collection(fs,'schedules'),{uid:user.uid,name:sn.value,time:st.value,kind:sk.value,enabled:true,createdAt:Date.now()});loadSchedule()}
function loadSchedule(){onSnapshot(query(collection(fs,'schedules'),where('uid','==',user.uid)),s=>{const el=document.getElementById('sched');if(el)el.innerHTML=s.docs.sort((a,b)=>a.data().time.localeCompare(b.data().time)).map(d=>{let x=d.data();return `<div class="card"><b>${x.time}</b> — ${esc(x.name)} <span class="muted">${x.kind}</span></div>`}).join('')||'<p class="muted">ยังไม่มี</p>'})}
window.multiplayer=()=>A.innerHTML=shell(`<section class="card"><h2>👥 Multiplayer Arena</h2><p class="muted">Firebase Realtime Database ทำให้ผู้เล่นคนละเครื่องเห็นห้องและคะแนนแบบเรียลไทม์</p><div class="row"><button class="primary" onclick="createRoom()">สร้างห้อง</button><input id="rc" class="input" style="max-width:220px" placeholder="รหัสห้อง"><button onclick="joinRoom()">เข้าห้อง</button></div><div id="arena" style="margin-top:14px"></div></section>`);
window.createRoom=async()=>{const code=Math.random().toString(36).slice(2,8).toUpperCase();await set(ref(rt,'rooms/'+code),{host:user.uid,hostName:user.displayName||user.email,started:false,createdAt:Date.now(),players:{[user.uid]:{name:user.displayName||user.email,score:0,ready:true}}});openRoom(code,true)};
window.joinRoom=async()=>{const code=rc.value.trim().toUpperCase();if(!code)return;await update(ref(rt,'rooms/'+code+'/players/'+user.uid),{name:user.displayName||user.email,score:0,ready:true});openRoom(code,false)};
function openRoom(code,host){onValue(ref(rt,'rooms/'+code),snap=>{const r=snap.val();if(!r){arena.innerHTML='<p class="bad">ห้องถูกปิด</p>';return}const ps=Object.entries(r.players||{}).sort((a,b)=>(b[1].score||0)-(a[1].score||0));arena.innerHTML=`<div class="card"><div>ห้อง</div><div class="room">${code}</div><p>${r.started?'🟢 กำลังแข่ง':'🟡 รอเริ่ม'}</p>${ps.map(([id,p],i)=>`<div class="player"><span>${i+1}. ${esc(p.name)}</span><b>${p.score||0}</b></div>`).join('')}<div class="row" style="margin-top:12px">${host&&!r.started?'<button class="primary" onclick="startRoom(\''+code+'\')">เริ่มแข่ง</button>':''}<button onclick="addScore(\''+code+'\')">+ คะแนน</button>${host?'<button class="danger" onclick="remove(ref(rt,\'rooms/'+code+'\'))">ปิดห้อง</button>':''}</div></div>`})}
window.startRoom=code=>update(ref(rt,'rooms/'+code),{started:true,startAt:Date.now()});window.addScore=async code=>{const p=ref(rt,'rooms/'+code+'/players/'+user.uid);onValue(p,s=>{if(s.exists())update(p,{score:(s.val().score||0)+1})},{onlyOnce:true})};

const sleepTopics=[
['โดยทั่วไปวัยรุ่นควรนอนประมาณกี่ชั่วโมงต่อคืน?','8–10 ชั่วโมง','7 ชั่วโมง','5–6 ชั่วโมง','11–13 ชั่วโมง'],
['การนอนให้เป็นเวลาช่วยเรื่องใดมากที่สุด?','จังหวะนาฬิกาชีวภาพ','ทำให้ไม่ต้องกินอาหาร','ทำให้ไม่ต้องเรียน','เพิ่มเวลาหน้าจอ'],
['คาเฟอีนช่วงเย็นอาจส่งผลอย่างไร?','ทำให้หลับยากขึ้น','ทำให้หลับทันที','ไม่มีผลเสมอ','ทำให้ร่างกายไม่ต้องนอน'],
['แสงจากหน้าจอก่อนนอนอาจรบกวนอะไร?','การเตรียมตัวของร่างกายเข้าสู่การนอน','การย่อยอาหารเท่านั้น','การได้ยิน','ส่วนสูง'],
['หากนอนไม่พอเป็นประจำ สิ่งใดอาจได้รับผลกระทบ?','สมาธิและความจำ','สีตา','กรุ๊ปเลือด','ลายนิ้วมือ'],
['ห้องนอนที่เหมาะกับการนอนควรเป็นอย่างไร?','มืด เงียบ และอุณหภูมิสบาย','สว่างมากและเสียงดัง','เปิดเกมตลอดคืน','ร้อนจัด'],
['การงีบช่วงดึกนานเกินไปอาจทำอะไร?','รบกวนการนอนกลางคืน','ทำให้ไม่ต้องนอนกลางคืน','ทำให้เรียนเก่งทันที','ไม่มีผลใดๆ เสมอ'],
['กิจวัตรก่อนนอนที่สม่ำเสมอมีประโยชน์อย่างไร?','ช่วยให้ร่างกายเรียนรู้เวลาพัก','ทำให้ไม่ต้องพัก','เพิ่มคาเฟอีนในร่างกาย','ทำให้ตื่นทั้งคืน'],
['เมื่อใกล้เวลานอนควรทำอะไรกับเกมที่ตื่นเต้นมาก?','หยุดหรือผ่อนกิจกรรมลง','เพิ่มความเข้มข้น','เล่นต่อจนเช้า','เพิ่มเสียงให้ดังที่สุด'],
['ถ้านอนแล้วตื่นไม่สดชื่นบ่อยๆ ควรทำอย่างไร?','ทบทวนเวลาและคุณภาพการนอน และปรึกษาผู้เชี่ยวชาญหากเป็นต่อเนื่อง','เพิ่มเกมก่อนนอน','ดื่มคาเฟอีนทันทีทุกครั้ง','นอนน้อยลง']
];
function makeSleepBank(){const out=[];for(let i=0;i<200;i++){const t=sleepTopics[i%sleepTopics.length];let q=t[0];if(i>=10)q+=' (ข้อทบทวน '+(Math.floor(i/10)+1)+')';out.push({id:'S'+(i+1),cat:'การนอน',q,choices:t.slice(1),answer:0,diff:i%4===0?'ง่าย':i%4===1?'ปานกลาง':i%4===2?'ยาก':'ท้าทาย'});}return out}
function makeStudyBank(){const out=[];const add=(cat,items)=>{for(let i=0;i<50;i++){const t=items[i%items.length];const n=Math.floor(i/items.length);out.push({id:cat+'-'+(i+1),cat,q:n?`${t[0]} (ด่านย่อย ${n+1})`:t[0],choices:t.slice(1),answer:0,diff:i%4===0?'ง่าย':i%4===1?'ปานกลาง':i%4===2?'ยาก':'ท้าทาย'});}};
add('คณิตศาสตร์',[
['ถ้า 7×8 เท่ากับเท่าไร?','56','48','64','54'],['25% ของ 200 เท่ากับเท่าไร?','50','25','75','100'],['พื้นที่สี่เหลี่ยมผืนผ้า กว้าง 5 ยาว 8 เท่ากับเท่าไร?','40','13','26','80'],['ถ้า x+9=15 แล้ว x เท่ากับเท่าไร?','6','24','9','5'],['ค่าเฉลี่ยของ 4, 6, 8 คือเท่าไร?','6','5','7','8']]);
add('วิทยาศาสตร์',[

const SLEEP_BANK=makeSleepBank(), STUDY_BANK=makeStudyBank();
let quizState=null;
window.quiz=()=>{A.innerHTML=shell(`<section class="card"><h2>🎯 ด่านคำถาม Health Hub</h2><p class="muted">มีคำถามการนอน 200 ข้อ และคำถามวิชาเรียน 500 ข้อ • เลือกหมวดและระดับความยาก • ทุก 10 ด่านมีบอส 👹</p><div class="grid"><div><label>หมวด</label><select id="qcat" class="input"><option value="sleep">😴 การนอน — 200 ข้อ</option><option value="study">📚 วิชาเรียน — 500 ข้อ</option></select></div><div><label>วิชา</label><select id="qsub" class="input"><option>ทุกวิชา</option><option>คณิตศาสตร์</option><option>วิทยาศาสตร์</option><option>ภาษาไทย</option><option>ภาษาอังกฤษ</option><option>สังคมศึกษา</option><option>ประวัติศาสตร์</option><option>คอมพิวเตอร์</option><option>ฟิสิกส์</option><option>เคมี</option><option>ชีววิทยา</option></select></div><div><label>ความยาก</label><select id="qd" class="input"><option>ทุกระดับ</option><option>ง่าย</option><option>ปานกลาง</option><option>ยาก</option><option>ท้าทาย</option></select></div></div><button class="primary" onclick="startQuiz()">🚀 เริ่มด่าน</button><div id="quizbox" style="margin-top:16px"></div></section>`);document.getElementById('qcat').onchange=()=>document.getElementById('qsub').disabled=document.getElementById('qcat').value==='sleep';};
window.startQuiz=()=>{let bank=qcat.value==='sleep'?SLEEP_BANK:STUDY_BANK;let sub=qsub.value,d=qd.value;if(sub!=='ทุกวิชา')bank=bank.filter(x=>x.cat===sub);if(d!=='ทุกระดับ')bank=bank.filter(x=>x.diff===d);bank=[...bank].sort(()=>Math.random()-.5);if(!bank.length)return alert('ไม่มีคำถามตามเงื่อนไขนี้');quizState={bank,index:0,score:0,streak:0,bossHp:100};showQuestion()};
function showQuestion(){const x=quizState.bank[quizState.index%quizState.bank.length];const level=Math.floor(quizState.index/10)+1;const boss=quizState.index%10===9;const hp=boss?quizState.bossHp:100;document.getElementById('quizbox').innerHTML=`<div class="card ${boss?'hero':''}"><div class="row"><b>ด่าน ${level}</b><span class="muted">ข้อ ${quizState.index+1}/${Math.min(quizState.bank.length,30)}</span><span class="xp">⭐ ${quizState.score} XP</span>${boss?'<b style="color:#fbbf24">👹 BOSS BATTLE</b>':''}</div>${boss?`<p><b>👹 บอสประจำด่าน</b> — ตอบถูกเพื่อโจมตีบอส</p><div class="bossbar"><div class="bossfill" style="width:${hp}%"></div></div><p class="muted">HP บอส: ${hp}/100</p>`:''}<h3>${esc(x.q)}</h3><div class="grid">${x.choices.map((c,i)=>`<button onclick="answerQuiz(${i})">${String.fromCharCode(65+i)}. ${esc(c)}</button>`).join('')}</div><p class="muted">${boss?'ถูก = โจมตีบอส 25 HP • ผิด = บอสโจมตีกลับ 10 HP':'ตอบให้ถูกเพื่อสะสม XP และรักษา Streak'}</p></div>`}
window.answerQuiz=(i)=>{const x=quizState.bank[quizState.index%quizState.bank.length],ok=i===x.answer,boss=quizState.index%10===9;if(ok){const dmg=boss?25:0;quizState.score+=boss?100:10;quizState.streak++;if(boss){quizState.bossHp=Math.max(0,quizState.bossHp-dmg);if(quizState.bossHp===0){alert('👹 BOSS DEFEATED! +100 XP');quizState.bossHp=100;}else alert('⚔️ โจมตีบอสสำเร็จ! -25 HP • +100 XP')}else alert('ถูกต้อง! +10 XP')}else{quizState.streak=0;if(boss){quizState.bossHp=Math.min(100,quizState.bossHp+10);alert('💥 บอสโจมตีกลับ! +10 HP\nคำตอบคือ: '+x.choices[x.answer])}else alert('ยังไม่ถูก คำตอบคือ: '+x.choices[x.answer])}quizState.index++;if(quizState.index>=30){document.getElementById('quizbox').innerHTML=`<div class="card"><h2>🏆 จบด่านชุดนี้!</h2><div class="big">${quizState.score} XP</div><p>Streak สูงสุดในรอบนี้: ${quizState.streak}</p><button class="primary" onclick="quiz()">เล่นชุดใหม่</button></div>`}else showQuestion()};

window.enablePush=async()=>{try{if(!messaging)return alert('Messaging ยังไม่พร้อม');const reg=await navigator.serviceWorker.register('/firebase-messaging-sw.js');const token=await getToken(messaging,{vapidKey:VAPID_KEY,serviceWorkerRegistration:reg});await setDoc(doc(fs,'fcmTokens',token),{uid:user.uid,token,createdAt:Date.now(),timezone:Intl.DateTimeFormat().resolvedOptions().timeZone},{merge:true});nt.innerHTML='<p class="ok">เปิด Push สำเร็จ ✓</p>'}catch(e){nt.innerHTML='<p class="bad">เปิด Push ไม่สำเร็จ: '+esc(e.message)+'</p>'}};
window.sleep=()=>A.innerHTML=shell(`<section class="card"><h2>😴 เวลานอน</h2><p class="muted">ตั้งเวลานอนแล้วระบบสามารถส่ง Push เตือนจากฝั่งเซิร์ฟเวอร์</p><input id="bt" class="input" type="time" value="22:00"><button class="primary" onclick="saveBed()">บันทึก</button><div id="sleepmsg"></div></section>`);window.saveBed=async()=>{await setDoc(doc(fs,'settings',user.uid),{bedTime:bt.value,timezone:Intl.DateTimeFormat().resolvedOptions().timeZone},{merge:true});sleepmsg.innerHTML='<p class="ok">บันทึกแล้ว ระบบ backend จะตรวจและส่งแจ้งเตือน</p>'};
function init(){if(!configured){login();return}app=initializeApp(cfg);auth=getAuth(app);rt=getDatabase(app);fs=getFirestore(app);try{messaging=getMessaging(app);onMessage(messaging,p=>{const n=p.notification||{};alert('🔔 '+(n.title||'Health Hub')+'\n'+(n.body||''))})}catch{}onAuthStateChanged(auth,u=>{user=u;if(u)home();else login()})}init();

function rpg(){let p=JSON.parse(localStorage.getItem(RPG_KEY)||'null');if(!p)p={name:user?.displayName||user?.email?.split('@')[0]||'Player',level:1,xp:0,coins:100,inventory:[],weapon:null,outfit:null,bossWins:0};return p}
function saveRpg(p){localStorage.setItem(RPG_KEY,JSON.stringify(p))}
function xpNeed(l){return 100+(l-1)*75}
function addXP(n){let p=rpg();p.xp+=n;let leveled=[];while(p.xp>=xpNeed(p.level)){p.xp-=xpNeed(p.level);p.level++;p.coins+=50;leveled.push(p.level)}saveRpg(p);if(leveled.length)alert('🎉 Level Up! Lv.'+p.level+'\n💰 +'+(leveled.length*50)+' Coins');return p}
function addCoins(n){let p=rpg();p.coins+=n;saveRpg(p);return p}
function character(){let p=rpg(),w=SHOP_ITEMS.find(x=>x.id===p.weapon),o=SHOP_ITEMS.find(x=>x.id===p.outfit);A.innerHTML=shell(`<section class="card"><h2>🧙 ตัวละครของฉัน</h2><div class="hero"><div style="font-size:70px">🧙‍♂️</div><h2>${esc(p.name)}</h2><div class="big">Lv.${p.level}</div><p>⭐ XP ${p.xp}/${xpNeed(p.level)} · 💰 ${p.coins} Coins</p><p>⚔️ ${w?esc(w.name):'ไม่มีอาวุธ'} ${w?'('+w.power+' ATK)':''}</p><p>🛡️ ${o?esc(o.name):'ชุดเริ่มต้น'} ${o?'(+'+o.hp+' HP)':''}</p><p>👹 ชนะบอส ${p.bossWins} ครั้ง</p></div><div class="row"><button class="primary" onclick="shop()">🛒 ไปที่ร้านค้า</button><button onclick="leaderboard()">🏆 ดูอันดับ</button></div></section>`)}
function shop(){let p=rpg();A.innerHTML=shell(`<section class="card"><div class="row"><h2>🛒 ร้านค้า</h2><span class="xp">💰 ${p.coins} Coins</span></div><p class="muted">ซื้ออาวุธ ชุด และผู้ช่วยเพื่อเพิ่มพลังในการต่อสู้บอส</p><div class="grid">${SHOP_ITEMS.map(i=>{let owned=p.inventory.includes(i.id),eq=p.weapon===i.id||p.outfit===i.id;return `<div class="card"><div style="font-size:38px">${i.name.split(' ')[0]}</div><h3>${esc(i.name)}</h3><p>${esc(i.desc)}</p><b>💰 ${i.price}</b><br><button class="${owned?'':'primary'}" style="margin-top:10px" onclick="buyItem('${i.id}')">${owned?(eq?'สวมใส่อยู่':'สวมใส่'):'ซื้อ'}</button></div>`}).join('')}</div></section>`)}
window.buyItem=(id)=>{let p=rpg(),i=SHOP_ITEMS.find(x=>x.id===id);if(!i)return;if(!p.inventory.includes(id)){if(p.coins<i.price)return alert('Coins ไม่พอ');p.coins-=i.price;p.inventory.push(id);alert('ซื้อ '+i.name+' สำเร็จ!')}if(i.type==='weapon')p.weapon=id;if(i.type==='outfit')p.outfit=id;saveRpg(p);shop()}
function leaderboard(){let p=rpg();A.innerHTML=shell(`<section class="card"><h2>🏆 Leaderboard</h2><p class="muted">อันดับ XP/Level สำหรับการแข่งขันกับเพื่อน เมื่อเชื่อม Firebase จะบันทึกคะแนนข้ามเครื่อง</p><div class="row"><button class="primary" onclick="publishScore()">☁️ อัปโหลดคะแนน</button><button onclick="loadLeaderboard()">🔄 รีเฟรช</button></div><div id="lb" style="margin-top:15px"><div class="player"><span>🥇 ${esc(p.name)}</span><b>Lv.${p.level} · ${p.level*100+p.xp} XP</b></div></div></section>`)}
window.publishScore=async()=>{if(!fs||!user)return alert('ต้องเชื่อม Firebase และเข้าสู่ระบบก่อน');let p=rpg();await setDoc(doc(fs,'leaderboard',user.uid),{uid:user.uid,name:p.name,level:p.level,xp:p.xp,totalXp:(p.level-1)*100+p.xp,coins:p.coins,updatedAt:Date.now()},{merge:true});alert('อัปโหลดคะแนนแล้ว');loadLeaderboard()}
window.loadLeaderboard=async()=>{if(!fs)return;try{const q=query(collection(fs,'leaderboard'));onSnapshot(q,snap=>{let a=snap.docs.map(d=>d.data()).sort((x,y)=>(y.totalXp||0)-(x.totalXp||0)).slice(0,50);const el=document.getElementById('lb');if(el)el.innerHTML=a.map((x,i)=>`<div class="player"><span>${i<3?['🥇','🥈','🥉'][i]:'#'+(i+1)} ${esc(x.name||'Player')}</span><b>Lv.${x.level||1} · ${x.totalXp||0} XP</b></div>`).join('')||'<p class="muted">ยังไม่มีคะแนน</p>'})}catch(e){alert(e.message)}}
// Reward quiz results with RPG XP/coins and rotating bosses.
const _oldStartQuiz=window.startQuiz;
window.startQuiz=()=>{_oldStartQuiz();if(quizState){quizState.rpgBossWins=0;quizState.rpgCoins=0}};
const _oldAnswerQuiz=window.answerQuiz;
window.answerQuiz=(i)=>{const before=quizState?.score||0;const idx=quizState?.index||0;const boss=idx%10===9;const x=quizState?.bank?.[idx%quizState.bank.length];const ok=x&&i===x.answer;_oldAnswerQuiz(i);if(ok){addXP(boss?100:10);addCoins(boss?30:3);if(boss){let p=rpg();p.bossWins++;saveRpg(p)}}};

const RPG135_KEY='hh_rpg_character_v135';
const RARITY=[

const GEAR135=[

 {id:'scholar_staff',name:'🔮 คทานักปราชญ์',slot:'weapon',rarity:'Uncommon',atk:12,price:220},

];

];
const BOSS135=[
 {name:'👹 Sleep Demon',hp:180,atk:18,pattern:['sleep','normal','drain'],reward:180},
 {name:'🐲 Math Dragon',hp:260,atk:25,pattern:['normal','crit','counter'],reward:300},
 {name:'🧪 Chemistry Beast',hp:340,atk:31,pattern:['poison','normal','drain'],reward:450},
 {name:'🧠 Knowledge Titan',hp:450,atk:38,pattern:['stun','crit','counter'],reward:650},
 {name:'🌌 Final Exam Lord',hp:650,atk:48,pattern:['drain','crit','stun','counter'],reward:1200}
];
function rpg135(){
 let p=JSON.parse(localStorage.getItem(RPG135_KEY)||'null');
 if(!p)p={name:user?.displayName||user?.email?.split('@')[0]||'Player',level:1,xp:0,coins:250,
 hp:120,mp:60,inventory:[],equip:{weapon:null,armor:null},skills:[],wins:0,totalDamage:0};
 return p;
}
function save135(p){localStorage.setItem(RPG135_KEY,JSON.stringify(p));}
function gear135(id){return GEAR135.find(x=>x.id===id)}
function stats135(p){
 let w=gear135(p.equip.weapon),a=gear135(p.equip.armor);
 return {maxHp:120+(p.level-1)*12+(a?.hp||0),maxMp:60+(p.level-1)*5+(a?.mp||0),
 atk:10+(p.level-1)*3+(w?.atk||0),def:5+Math.floor((p.level-1)*1.5)+(a?.def||0),
 crit:5+(w?.crit||0)};
}
function xpNeed135(l){return 100+((l-1)*80)}
function gain135(xp,coins){
 let p=rpg135();p.xp+=xp;p.coins+=coins;let ups=0;
 while(p.xp>=xpNeed135(p.level)){p.xp-=xpNeed135(p.level);p.level++;ups++}
 let st=stats135(p);p.hp=Math.min(st.maxHp,p.hp||st.maxHp);p.mp=Math.min(st.maxMp,p.mp||st.maxMp);
 save135(p);if(ups)alert('🎉 LEVEL UP! ตอนนี้ Lv.'+p.level+'\\n💰 โบนัส '+(ups*100)+' Coins');if(ups)p.coins+=ups*100;save135(p);return p;
}
function rarityClass(r){return 'rarity-'+r.toLowerCase()}
function character(){
 const p=rpg135(),st=stats135(p),w=gear135(p.equip.weapon),a=gear135(p.equip.armor);
 A.innerHTML=shell(`<section class="card"><div class="row"><h2>🧙 Character RPG</h2><span class="xp">Lv.${p.level}</span></div>
 <div class="hero"><div style="font-size:68px">🧙‍♂️</div><h2>${esc(p.name)}</h2>
 <p>⭐ XP ${p.xp}/${xpNeed135(p.level)} · 💰 ${p.coins} Coins</p>
 <div class="grid">
 <div class="card"><b>❤️ HP</b><div class="big">${p.hp||st.maxHp}/${st.maxHp}</div></div>
 <div class="card"><b>🔷 MP</b><div class="big">${p.mp||st.maxMp}/${st.maxMp}</div></div>
 <div class="card"><b>⚔️ ATK</b><div class="big">${st.atk}</div></div>
 <div class="card"><b>🛡️ DEF</b><div class="big">${st.def}</div></div>
 <div class="card"><b>🎯 CRIT</b><div class="big">${st.crit}%</div></div>
 </div></div>
 <p>⚔️ อาวุธ: ${w?esc(w.name)+' <span class="'+rarityClass(w.rarity)+'">['+w.rarity+']</span>':'ยังไม่มี'}</p>
 <p>🛡️ ชุด: ${a?esc(a.name)+' <span class="'+rarityClass(a.rarity)+'">['+a.rarity+']</span>':'ยังไม่มี'}</p>
 <p>👹 ชนะบอส ${p.wins} ครั้ง · 💥 Damage รวม ${p.totalDamage}</p>
 <div class="row"><button class="primary" onclick="shop135()">🛒 ร้านค้า RPG</button><button onclick="skills135()">✨ สกิล</button><button onclick="boss135()">👹 Boss Arena</button></div>
 </section>`);
}
function shop135(){
 const p=rpg135();A.innerHTML=shell(`<section class="card"><div class="row"><h2>🛒 RPG Shop</h2><b>💰 ${p.coins}</b></div><p class="muted">ไอเทมแบ่งระดับ Common → Legendary</p><div class="grid">${GEAR135.map(i=>`<div class="card"><h3>${esc(i.name)}</h3><b class="${rarityClass(i.rarity)}">${i.rarity}</b><p>${i.atk?`⚔️ +${i.atk} ATK `:''}${i.hp?`❤️ +${i.hp} HP `:''}${i.def?`🛡️ +${i.def} DEF `:''}${i.crit?`🎯 +${i.crit}% CRIT`:''}</p><b>💰 ${i.price}</b><br><button style="margin-top:10px" onclick="buy135('${i.id}')">${p.inventory.includes(i.id)?(p.equip.weapon===i.id||p.equip.armor===i.id?'สวมใส่อยู่':'สวมใส่'):'ซื้อ'}</button></div>`).join('')}</div></section>`);
}
window.buy135=id=>{let p=rpg135(),i=gear135(id);if(!i)return;if(!p.inventory.includes(id)){if(p.coins<i.price)return alert('Coins ไม่พอ');p.coins-=i.price;p.inventory.push(id)}p.equip[i.slot]=id;let st=stats135(p);p.hp=Math.min(st.maxHp,p.hp||st.maxHp);p.mp=Math.min(st.maxMp,p.mp||st.maxMp);save135(p);shop135()};
function skills135(){
 const p=rpg135();A.innerHTML=shell(`<section class="card"><h2>✨ Skill Tree</h2><p class="muted">ปลดล็อกด้วย Coins และใช้ MP ตอนสู้ Boss</p><div class="grid">${SKILLS135.map(k=>`<div class="card"><h3>${k.name}</h3><p>${k.desc}</p><b>🔷 ${k.cost} MP</b><br><button style="margin-top:10px" onclick="unlock135('${k.id}')">${p.skills.includes(k.id)?'ปลดล็อกแล้ว':'ปลดล็อก 150 Coins'}</button></div>`).join('')}</div></section>`);
}
window.unlock135=id=>{let p=rpg135();if(p.skills.includes(id))return;if(p.coins<150)return alert('Coins ไม่พอ');p.coins-=150;p.skills.push(id);save135(p);skills135()};
function boss135(){
 let p=rpg135(),idx=Math.min(Math.floor((p.level-1)/5),BOSS135.length-1),b=BOSS135[idx],st=stats135(p);
 p.hp=Math.min(st.maxHp,p.hp||st.maxHp);p.mp=Math.min(st.maxMp,p.mp||st.maxMp);
 let state={boss:{...b},player:p.hp,pm:p.mp,shield:false,critBoost:0,turn:0};
 A.innerHTML=shell(`<section class="card hero"><div class="row"><h2>👹 Boss Arena</h2><b>${esc(b.name)}</b></div>
 <div class="bossbar"><div id="b135" class="bossfill" style="width:100%"></div></div><p>Boss HP: <b id="bh135">${b.hp}</b>/${b.hp}</p>
 <p>❤️ HP <b id="ph135">${state.player}</b>/${st.maxHp} · 🔷 MP <b id="pm135">${state.pm}</b>/${st.maxMp}</p>
 <div class="row">${SKILLS135.filter(k=>p.skills.includes(k.id)).map(k=>`<button onclick="skillBoss135('${k.id}')">${k.name}</button>`).join('')||'<span class="muted">ไปปลดล็อกสกิลก่อน</span>'}</div>
 <div class="row" style="margin-top:10px"><button class="primary" onclick="attackBoss135()">⚔️ โจมตี</button><button onclick="defendBoss135()">🛡️ ป้องกัน</button></div>
 <p id="log135" class="muted" aria-live="polite">⚔️ ${esc(b.name)} รอการท้าทาย...</p></section>`);
 window._boss135=state;
}
function bossRender135(){let s=window._boss135;if(!s)return;const p=rpg135(),st=stats135(p);document.getElementById('b135').style.width=Math.max(0,s.boss.hp/BOSS135[Math.min(Math.floor((p.level-1)/5),4)].hp*100)+'%';document.getElementById('bh135').textContent=Math.max(0,s.boss.hp);document.getElementById('ph135').textContent=Math.max(0,Math.round(s.player));document.getElementById('pm135').textContent=Math.max(0,Math.round(s.pm));}
function playerHit135(mult=1){let p=rpg135(),st=stats135(p),crit=Math.random()*100<st.crit+(window._boss135.critBoost||0),dmg=Math.round(st.atk*mult*(crit?2:1));if(crit)document.getElementById('log135').textContent='💥 CRITICAL! '+dmg+' ดาเมจ';return dmg}
function bossTurn135(){let s=window._boss135,p=rpg135(),st=stats135(p),pat=s.boss.pattern[s.turn%s.boss.pattern.length],dmg=s.boss.atk;if(pat==='crit')dmg*=2;if(pat==='drain'){s.player-=Math.round(dmg*.7);s.boss.hp+=Math.round(dmg*.4)}else if(pat==='poison'){s.player-=dmg;s.player-=5}else if(pat==='stun'){s.player-=Math.round(dmg*.7)}else if(pat==='counter'){s.player-=Math.round(dmg*.6)}else s.player-=dmg;if(s.shield){s.player+=Math.round(dmg*.5);s.shield=false}document.getElementById('log135').textContent=(pat==='crit'?'💥 BOSS CRITICAL! ':pat==='drain'?'🩸 บอสดูดพลัง! ':pat==='poison'?'☠️ พิษ! ':pat==='stun'?'💫 สตัน! ':'👹 บอสโจมตี! ')+Math.round(dmg)+' ดาเมจ';s.turn++;bossRender135();if(s.player<=0){alert('💀 แพ้บอส! กลับไปฝึกเพิ่ม Level');character();}}
window.attackBoss135=()=>{let s=window._boss135;if(!s)return;let dmg=playerHit135();s.boss.hp-=dmg;rpg135().totalDamage+=dmg;save135(rpg135());if(s.boss.hp<=0){let p=rpg135();p.wins++;save135(p);gain135(s.boss.reward,Math.round(s.boss.reward/2));alert('🏆 BOSS DEFEATED!\\n+'+s.boss.reward+' XP');character();return}bossTurn135();};
window.defendBoss135=()=>{let s=window._boss135;if(!s)return;s.shield=true;s.player+=Math.round(stats135(rpg135()).def*.8);document.getElementById('log135').textContent='🛡️ ตั้งรับ ลดความเสียหายครั้งถัดไป';bossTurn135()};
window.skillBoss135=id=>{let s=window._boss135,p=rpg135(),k=SKILLS135.find(x=>x.id===id);if(!k||s.pm<k.cost)return alert('MP ไม่พอ');s.pm-=k.cost;if(id==='focus'){let d=playerHit135(1.6);s.boss.hp-=d;document.getElementById('log135').textContent='🎯 Focus Strike! -'+d+' HP'}if(id==='heal'){let st=stats135(p);s.player=Math.min(st.maxHp,s.player+Math.round(st.maxHp*.3));document.getElementById('log135').textContent='💚 ฟื้น HP 30%'}if(id==='shield'){s.shield=true;document.getElementById('log135').textContent='🛡️ Smart Shield เปิดใช้งาน'}if(id==='critical'){s.critBoost=25;document.getElementById('log135').textContent='🔥 Critical Mind: +25% CRIT'}if(s.boss.hp<=0){p.wins++;save135(p);gain135(s.boss.reward,Math.round(s.boss.reward/2));alert('🏆 BOSS DEFEATED!');character();return}bossTurn135();bossRender135()};
